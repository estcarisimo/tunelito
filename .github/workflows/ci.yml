name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries for the Tauri host
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  web:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the window UI
        working-directory: app
        run: npm ci && npm run build

  docs:
    name: Docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Build the MkDocs site
        run: |
          uv venv .docs-venv
          uv pip install --python .docs-venv/bin/python -r docs/requirements.txt
          .docs-venv/bin/mkdocs build --strict

  windows:
    name: Windows portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - name: Privileged helper
        run: cargo build --release -p tunelito-priv
      - name: Build the portable exe and the optional installer
        working-directory: app
        # No TUNELITO_EMBED_DIR here: CI does not download cloudflared, so this
        # exe carries stubs. The release workflow embeds the pinned binaries.
        run: npm run tauri build -- --bundles nsis
      - name: Sign if a secret is configured
        shell: pwsh
        run: ./scripts/sign-windows.ps1 target/release/tunelito.exe
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODESIGN_ACCOUNT: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CODESIGN_PROFILE: ${{ secrets.AZURE_CODESIGN_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORG }}
          SIGNPATH_PROJECT: ${{ secrets.SIGNPATH_PROJECT }}
          SIGNPATH_POLICY: ${{ secrets.SIGNPATH_POLICY }}
      - name: Upload the portable exe
        uses: actions/upload-artifact@v7
        with:
          name: tunelito-exe
          path: target/release/tunelito.exe
          if-no-files-found: error
      - name: Upload the optional installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tunelito-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: warn
