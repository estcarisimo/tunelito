name: Release

# Runs only when a version tag is pushed. Opens a draft release.
# Do not create tags from CI. Signing secrets are optional placeholders:
# when they are unset, installers are still built and left unsigned.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  bundle:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - name: Helper binaries
        run: cargo build --release -p tunelito-connect -p tunelito-priv
      - name: Bundle the host app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Placeholders. Leave the secrets empty to skip signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Tunelito ${{ github.ref_name }}
          releaseBody: |
            Draft installer build for ${{ github.ref_name }}.
            Windows and macOS service control inside the app is not executed in CI.
            Code-signing secrets are optional. Empty secrets produce unsigned installers.
            `tunelito-connect` and `tunelito-priv` are attached as extra artifacts and are not yet inside the installer.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
      - name: Upload helper binaries
        uses: actions/upload-artifact@v7
        with:
          name: helpers-${{ matrix.os }}
          path: |
            target/release/tunelito-connect
            target/release/tunelito-connect.exe
            target/release/tunelito-priv
            target/release/tunelito-priv.exe
          if-no-files-found: warn
