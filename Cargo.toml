[workspace]
resolver = "2"
members = [
    "crates/tunelito-core",
    "crates/tunelito-connect",
    "crates/tunelito-priv",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Esteban Carisimo <esteban.carisimo@northwestern.edu>"]
repository = "https://github.com/estcarisimo/tunelito"
rust-version = "1.83"

[workspace.dependencies]
tunelito-core = { path = "crates/tunelito-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
hex = "0.4"
ssh-key = { version = "0.6.7", features = ["ed25519", "rand_core"] }
rand = "0.8"
flate2 = "1"
tar = "0.4"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
